# Rondix vhost for the nginx-proxy container.
# Installed to /opt/nginx/conf.d/rondix.conf on the host, which is mounted
# into the container at /etc/nginx/conf.d.
#
# SERVER_NAME is substituted by register-site.sh.
#
# Note the upstream is a container name, not a port on the host: nginx-proxy
# and rondix-frontend share the `proxy` docker network, so docker's embedded
# DNS resolves `rondix-frontend` to the container. Nothing is published to the
# host, which is why this cannot collide with the other frontends that also
# listen on 3000 inside their own containers.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Webroot for certbot, matching the existing /var/www/certbot mount.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Build assets carry a content hash, so they can be cached indefinitely.
    location /_next/static/ {
        proxy_pass http://rondix-frontend:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://rondix-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

