# Rondix vhost, TLS version. Installed by enable-ssl.sh once a certificate
# exists. Mirrors the shape of nasag/farkesht/behyarzist on this server.
#
# SERVER_NAMES / SERVER_NAME are substituted by enable-ssl.sh.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAMES;

    # Must stay reachable over plain HTTP for certificate renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_NAMES;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_rondix:5m;
    ssl_session_timeout 1d;

    # Resolved per request, not at config load: a literal container name would
    # make every proxy reload fail whenever Rondix is down, taking the other
    # sites on this proxy with it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 20m;

    access_log /var/log/nginx/rondix.access.log;
    error_log  /var/log/nginx/rondix.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        set $rondix_static http://rondix-frontend:3000;
        proxy_pass $rondix_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $rondix_upstream http://rondix-frontend:3000;
        proxy_pass $rondix_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering       off;
    }
}
