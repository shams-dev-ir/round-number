name: Deploy

# Builds a container image in CI, publishes it to GHCR, then tells the server
# to pull and swap. The server never builds — it only pulls an image and
# restarts one compose project, so nothing else running on that box is touched.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Plain value, not a secret: a filesystem path is not sensitive, and holding
  # it as a secret got it masked as *** in the logs, which hid the real cause
  # of a failed upload. Must match the APP_DIR in deploy/register-site.sh.
  APP_DIR: /opt/rondix
  CONTAINER: rondix-frontend
  PROXY_CONTAINER: nginx-proxy

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          # Lowercase: GHCR rejects uppercase in repository names.
          repo=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # Layer cache lives in the registry, so an unchanged dependency tree
          # skips `npm ci` entirely on later builds.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

  deploy:
    name: Release to server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secrets are configured
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # if-blocks, not `[ test ] && assign`: the latter returns 1 when the
          # test is false, which under `set -e` aborts exactly when every
          # secret is correctly set.
          missing=""
          if [ -z "$SSH_HOST" ]; then missing="$missing SSH_HOST"; fi
          if [ -z "$SSH_USER" ]; then missing="$missing SSH_USER"; fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then missing="$missing SSH_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "See DEPLOY.md for the full list."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Sync compose file
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            deploy/docker-compose.yml "$SSH_USER@$SSH_HOST:$APP_DIR/docker-compose.yml"

      - name: Pull and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            cd "$APP_DIR"
            # Pin the exact commit image so a rollback is just re-running an
            # older workflow, and so restarts can't silently pick up a new build.
            echo "RONDIX_IMAGE=$IMAGE" > .env

            # GHCR packages are private by default, so authenticate for the pull.
            # This uses the workflow's own short-lived token and is discarded
            # immediately after, leaving no standing credential on the server.
            echo '${{ secrets.GITHUB_TOKEN }}' \
              | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            docker compose pull
            docker compose up -d --remove-orphans

            # Only ever clean up our own old images — other projects share this
            # docker daemon, so a blanket prune is not ours to run.
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
              | awk '\$1 ~ /round-number/ && \$1 !~ /(latest|buildcache)\$/ {print \$2}' \
              | tail -n +4 | xargs -r docker rmi -f 2>/dev/null || true
          EOF

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -euo pipefail <<EOF
            # The container publishes no host port, and the nginx image has no
            # curl to probe with, so rely on the HEALTHCHECK baked into our own
            # image and read the status docker already tracks.
            for i in \$(seq 1 40); do
              status=\$(docker inspect --format '{{.State.Health.Status}}' $CONTAINER 2>/dev/null || echo missing)
              case "\$status" in
                healthy)   echo "container healthy after \$((i*3))s"; exit 0 ;;
                unhealthy) echo "container reported unhealthy"; break ;;
              esac
              sleep 3
            done
            echo "Container did not become healthy (last status: \${status:-unknown})"
            docker ps --filter "name=$CONTAINER"
            docker logs --tail 60 $CONTAINER || true
            exit 1
          EOF

      - name: Verify the site answers through the proxy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SITE_HOST: ${{ secrets.SITE_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_HOST" ]; then
            echo "SITE_HOST secret not set — skipping public check."
            exit 0
          fi
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$SITE_HOST/" || true)
            if [ "$code" = "200" ]; then echo "$SITE_HOST returned 200"; exit 0; fi
            echo "  attempt $i: got '$code'"
            sleep 3
          done
          echo "::error::$SITE_HOST did not return 200 — check the vhost in /opt/nginx/conf.d/rondix.conf"
          exit 1
