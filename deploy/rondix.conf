# Rondix vhost for the nginx-proxy container.
# Installed to /opt/nginx/conf.d/rondix.conf, mounted into the container at
# /etc/nginx/conf.d. SERVER_NAME is substituted by register-site.sh.
#
# Follows the same shape as nasag/farkesht/behyarzist on this server.
#
# The upstream deliberately goes through a variable plus docker's embedded
# resolver rather than `proxy_pass http://rondix-frontend:3000` directly.
# A literal name is resolved when the config loads, so nginx -t fails while the
# container is absent — and worse, any reload while Rondix happens to be down
# would fail for *every* site this proxy serves. Via a variable, resolution
# happens per request, so this vhost can neither block a reload nor take the
# other sites down with it.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 20m;

    access_log /var/log/nginx/rondix.access.log;
    error_log  /var/log/nginx/rondix.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed filenames, so these can be cached indefinitely.
    location /_next/static/ {
        set $rondix_static http://rondix-frontend:3000;
        proxy_pass $rondix_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        set $rondix_upstream http://rondix-frontend:3000;
        proxy_pass $rondix_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering       off;
    }
}

# ---------------------------------------------------------------------------
# HTTPS. Left out until a certificate exists, because nginx refuses to load a
# server block whose ssl_certificate file is missing.
#
# Issue the cert (the webroot matches the proxy's existing /var/www/certbot
# mount), then run enable-ssl.sh to swap this file for the TLS version:
#
#   docker run --rm \
#     -v /opt/nginx/certbot/conf:/etc/letsencrypt \
#     -v /opt/nginx/certbot/www:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d SERVER_NAME --agree-tos -m you@example.com -n
# ---------------------------------------------------------------------------
