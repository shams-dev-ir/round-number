# /etc/nginx/sites-available/rondix
#
# Deliberately HTTP-only. Running `certbot --nginx -d <domain>` later rewrites
# this file in place: it adds the TLS server block, the certificate paths and
# the 80 -> 443 redirect. Hand-writing those up front just fights certbot.
#
# SERVER_NAME is substituted by server-setup.sh. With no real domain yet, use a
# wildcard-DNS host pointing at your IP — for 203.0.113.5 that is
#   203.0.113.5.nip.io      or      203-0-113-5.sslip.io
# Both resolve with zero DNS configuration and work with Let's Encrypt.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # The Next.js server compresses HTML itself; gzip the rest here.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Build assets carry a content hash in the filename, so they can be cached
    # forever — this is the single biggest win for repeat visits.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
